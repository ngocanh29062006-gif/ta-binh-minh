<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6f2e3;
    --ink: #2b2b2b;
    --gingham: #dce8f2;
    --gingham-line: rgba(110, 150, 195, .38);
    --cherry: #e0382f;
    --cherry-leaf: #4f9a43;
    --lilac: #a79bd1;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", cursive;
    color: var(--ink);
    overflow: hidden;
    background: var(--cream);
  }

  /* ---------- Man (stage) ---------- */
  .stage {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  }
  .stage.active { display: flex; }
  .stage .deco { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  /* Man 1: nen kem + sao */
  #stage1 { background: var(--cream) center / cover no-repeat; }
  #stage1 .col {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: 18px; text-align: center;
  }
  #typed {
    font-size: clamp(22px, 5.2vw, 34px);
    min-height: 1.4em;
    margin: 0;
    position: relative; top: -4vh;
  }
  #typed::after {
    content: ""; display: inline-block; width: 2px; height: 1em;
    background: var(--ink); margin-left: 3px; vertical-align: -0.12em;
    animation: blink .7s steps(1) infinite;
  }
  #typed.done::after { display: none; }
  @keyframes blink { 50% { opacity: 0; } }

  .hero {
    width: min(58vw, 240px);
    opacity: 0; transform: scale(.6);
  }
  .hero.pop { animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) forwards; }
  @keyframes pop { to { opacity: 1; transform: scale(1); } }

  /* Man 2, 3, 4: gingham + cherry */
  #stage2, #stage3, #stage4 {
    background-color: var(--gingham);
    background-image:
      repeating-linear-gradient(0deg, var(--gingham-line) 0 24px, transparent 24px 48px),
      repeating-linear-gradient(90deg, var(--gingham-line) 0 24px, transparent 24px 48px);
  }
  .card {
    position: relative; z-index: 1;
    width: min(86vw, 360px);
    background: var(--cream);
    border: 1.5px solid var(--ink);
    border-radius: 28px;
    padding: 64px 24px 28px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    box-shadow: 0 6px 0 rgba(43, 43, 43, .08);
  }
  .card .badge {
    position: absolute; top: -48px; left: 50%; transform: translateX(-50%);
    width: 96px; height: 96px; object-fit: contain;
    font-size: 64px; line-height: 96px; text-align: center;
  }
  .card p { margin: 0; font-size: 17px; line-height: 1.5; }
  .card ul { margin: 0; padding: 0; list-style: none; text-align: left; font-size: 16px; line-height: 1.6; }
  .card li + li { margin-top: 8px; }
  .card .pic { width: 150px; height: 150px; object-fit: contain; border-radius: 16px; }

  .cake-btn {
    background: none; border: 0; padding: 4px; cursor: pointer;
    font-size: 84px; line-height: 1;
    animation: wiggle 1.6s ease-in-out infinite;
  }
  .cake-btn img { width: 110px; height: 110px; object-fit: contain; display: block; }
  .cake-btn:focus-visible, .pill:focus-visible { outline: 3px solid var(--lilac); outline-offset: 4px; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    20% { transform: rotate(-6deg); }
    40% { transform: rotate(6deg); }
    60% { transform: rotate(0); }
  }

  /* Nut pill */
  .pill {
    font: inherit; font-size: 16px; font-weight: 700;
    color: var(--ink); background: #fff;
    border: 2px solid var(--ink); border-radius: 999px;
    padding: 8px 26px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(43, 43, 43, .15);
    transition: transform .12s;
  }
  .pill:active { transform: translateY(2px); box-shadow: none; }
  #next1 { opacity: 0; visibility: hidden; transition: opacity .5s; }
  #next1.show { opacity: 1; visibility: visible; }

  /* Chuyen man */
  .stage.active .col, .stage.active .card { animation: enter .45s ease both; }
  @keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    .cake-btn, .stage.active .col, .stage.active .card, .hero.pop { animation: none; }
    .hero { opacity: 1; transform: none; }
    #typed::after { animation: none; }
  }
</style>
</head>
<body>

<!-- MAN 1 -->
<section class="stage active" id="stage1" aria-live="polite">
  <svg class="deco" id="stars" aria-hidden="true"></svg>
  <div class="col">
    <h1 id="typed" style="font-weight:400"></h1>
    <div id="hero-slot"></div>
    <button class="pill" id="next1">next :3</button>
  </div>
</section>

<!-- MAN 2 -->
<section class="stage" id="stage2">
  <svg class="deco" id="cherries2" aria-hidden="true"></svg>
  <div class="card">
    <div class="badge" id="badge2"></div>
    <p id="hint2"></p>
    <button class="cake-btn" id="cake" aria-label="Mo qua"></button>
  </div>
</section>

<!-- MAN 3 -->
<section class="stage" id="stage3">
  <svg class="deco" id="cherries3" aria-hidden="true"></svg>
  <div class="card">
    <div class="badge" id="badge3"></div>
    <p id="gift-text"></p>
    <div id="gift-slot"></div>
    <button class="pill" id="wishes-btn">my wishes</button>
  </div>
</section>

<!-- MAN 4 (KHONG co trong video, chi la cho de gan loi chuc) -->
<section class="stage" id="stage4">
  <svg class="deco" id="cherries4" aria-hidden="true"></svg>
  <div class="card">
    <div class="badge" id="badge4"></div>
    <ul id="wishes-list"></ul>
    <button class="pill" id="replay">replay</button>
  </div>
</section>

<script>
/* ============ CAU HINH: sua o day ============ */
const CONFIG = {
  title: "Happy Birthday!",                   // dong chu go o man 1
  hint: "tap on the cake to open your gift!", // chu o man 2
  giftText: "it's a jellycat bunny!! :D",     // chu o man 3
  wishes: [                                   // man 4: tu viet loi chuc cua ban
    "Chúc anh Bình Minh tuổi mới nhiều niềm vui, sức khỏe thực tập thuận lợi và nhiều may mắn"
  ],
  /* Anh: bo file vao thu muc assets/ voi dung ten duoi day.
     Neu chua co file, trang se hien emoji thay the. */
  images: {
    starBg:    "assets/star-bg.png",    // nen man 1 (tuy chon)
    hero:      "assets/hero.png",       // hinh giua man 1
    badge:     "assets/badge.png",      // hinh nho tren dau the (man 2, 3, 4)
    cake:      "assets/cake.png",       // banh de bam o man 2
    gift:      "assets/gift.png"        // hinh qua o man 3
  },
  fallbackEmoji: { hero: "🐰", badge: "🎂", cake: "🎂", gift: "🧸" }
};
/* =============================================== */

const $ = (id) => document.getElementById(id);
const NS = "http://www.w3.org/2000/svg";

/* Anh co fallback emoji */
function imgOrEmoji(key, cls) {
  const img = new Image();
  img.alt = "";
  if (cls) img.className = cls;
  img.src = CONFIG.images[key];
  img.onerror = () => {
    const span = document.createElement("span");
    span.textContent = CONFIG.fallbackEmoji[key];
    span.style.fontSize = "5rem";
    span.className = img.className;
    img.replaceWith(span);
  };
  return img;
}

/* Nen sao (man 1) */
const STAR_COLORS = ["#6fae7a", "#e58fb0", "#6f9fd8", "#e0a34a", "#8a6a55", "#9c8fd1"];
function starPath(cx, cy, r) {
  let d = "";
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI / 5) * i - Math.PI / 2;
    const rad = i % 2 ? r * 0.45 : r;
    d += (i ? "L" : "M") + (cx + rad * Math.cos(a)).toFixed(1) + " " + (cy + rad * Math.sin(a)).toFixed(1);
  }
  return d + "Z";
}
function scatter(svg, count, draw) {
  const W = 1000, H = 1000;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  svg.innerHTML = "";
  const placed = [];
  let tries = 0;
  while (placed.length < count && tries++ < 2000) {
    const x = 40 + Math.random() * (W - 80), y = 40 + Math.random() * (H - 80);
    if (placed.some(p => Math.hypot(p.x - x, p.y - y) < 120)) continue;
    placed.push({ x, y });
    draw(svg, x, y);
  }
}
function drawStar(svg, x, y) {
  const p = document.createElementNS(NS, "path");
  p.setAttribute("d", starPath(x, y, 14 + Math.random() * 8));
  p.setAttribute("fill", STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)]);
  p.setAttribute("transform", `rotate(${Math.random() * 40 - 20} ${x} ${y})`);
  svg.appendChild(p);
}

/* Cherry (man 2, 3, 4) */
function drawCherry(svg, x, y) {
  const filled = Math.random() > 0.4;
  const s = 0.8 + Math.random() * 0.5;
  const g = document.createElementNS(NS, "g");
  g.setAttribute("transform", `translate(${x} ${y}) scale(${s}) rotate(${Math.random() * 50 - 25})`);
  const fill = filled ? "var(--cherry)" : "#fff";
  const stroke = filled ? "none" : "var(--lilac)";
  g.innerHTML = `
    <path d="M-10 6 Q-6 -26 8 -34 M14 8 Q14 -22 8 -34" fill="none" stroke="${filled ? "#3f7a37" : "var(--lilac)"}" stroke-width="3" stroke-linecap="round"/>
    <path d="M8 -34 Q26 -42 34 -28 Q16 -22 8 -34Z" fill="${filled ? "var(--cherry-leaf)" : "#fff"}" stroke="${filled ? "none" : "var(--lilac)"}" stroke-width="2.5"/>
    <circle cx="-10" cy="14" r="13" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
    <circle cx="14" cy="16" r="13" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>
    ${filled ? '<circle cx="-14" cy="9" r="3" fill="#fff" opacity=".6"/><circle cx="10" cy="11" r="3" fill="#fff" opacity=".6"/>' : ""}`;
  svg.appendChild(g);
}

/* Chuyen man */
function go(n) {
  document.querySelectorAll(".stage").forEach(s => s.classList.remove("active"));
  $("stage" + n).classList.add("active");
}

/* Hieu ung go chu man 1 */
function typeText(el, text, speed, onDone) {
  el.textContent = "";
  el.classList.remove("done");
  let i = 0;
  const t = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(t); el.classList.add("done"); onDone && onDone(); }
  }, speed);
}

function runStage1() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  $("next1").classList.remove("show");
  const slot = $("hero-slot");
  slot.innerHTML = "";
  const hero = imgOrEmoji("hero", "hero");
  slot.appendChild(hero);
  const title = CONFIG.title;
  // Hinh hien len cung luc voi luc bat dau go chu
  requestAnimationFrame(() => hero.classList.add("pop"));
  if (reduce) { $("typed").textContent = title; $("next1").classList.add("show"); return; }
  typeText($("typed"), title, 90, () => $("next1").classList.add("show"));
}

/* Khoi tao */
(function init() {
  scatter($("stars"), 26, drawStar);
  ["2", "3", "4"].forEach(n => scatter($("cherries" + n), 22, drawCherry));

  // Nen anh tuy chon cho man 1
  const bg = new Image();
  bg.onload = () => { $("stage1").style.backgroundImage = `url(${CONFIG.images.starBg})`; $("stars").style.display = "none"; };
  bg.src = CONFIG.images.starBg;

  ["2", "3", "4"].forEach(n => $("badge" + n).appendChild(imgOrEmoji("badge")));
  $("hint2").textContent = CONFIG.hint;
  $("cake").appendChild(imgOrEmoji("cake"));
  $("gift-text").textContent = CONFIG.giftText;
  $("gift-slot").appendChild(imgOrEmoji("gift", "pic"));
  $("wishes-list").innerHTML = CONFIG.wishes.map(w => `<li>${w}</li>`).join("");

  $("next1").onclick = () => go(2);
  $("cake").onclick = () => go(3);
  $("wishes-btn").onclick = () => go(4);
  $("replay").onclick = () => { go(1); runStage1(); };

  runStage1();
})();
</script>
</body>
</html>
